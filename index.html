<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="hero-bg-container">
        <img src="images/bg-desktop-light.jpg" alt="background image" id="hero-image">
    </div>
    
    <div class="todo-wrapper">
        
        <div id="header">
            <h1>TODO</h1>
            <img src="images/icon-moon.svg" alt="moon icon" id="moon-icon">
        </div>
        
        <form id="todo-form">
            <div id="input-label">
                <button type="submit" class="circle-btn" aria-label="Add todo"></button>
                <input type="text" id="input" placeholder="Create a new todo..." autocomplete="off">
            </div>
        </form>

        <div id="list-content">
            <div id="todo-rows-container"></div>

            <div class="todo-footer">
                <span class="items-left"><span id="items-count">0</span> items left</span>
                <div class="filters">
                    <button class="filter-btn filter-btn--active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button class="clear-btn" id="clear-completed">Clear Completed</button>
            </div>
        </div>

        <p class="drag-help-text">Drag and drop to reorder list</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
